name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1
      - name: Fix-script tests, fakes only (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/fix.ps1
      - name: Fix-script tests, fakes only (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/fix.ps1
      - name: Tune-scan tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/tune.ps1
      - name: Tune-scan tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/tune.ps1
      # Warnings only for now: the result is shown, it does not fail the build.
      - name: PSScriptAnalyzer 1.23.0 (pinned, warn-only)
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force -AllowClobber
          Import-Module PSScriptAnalyzer -RequiredVersion 1.23.0
          $r = foreach ($f in 'lanq-makeready.ps1', 'lanq-makeready-fix.ps1', 'lanq-makeready-tune.ps1') { Invoke-ScriptAnalyzer -Path $f -Severity Warning, Error }
          $r | Sort-Object ScriptName, Line | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap | Out-String -Width 220
          "PSScriptAnalyzer: $(@($r).Count) finding(s) (warn-only)"
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning lanq-makeready.sh lanq-makeready-fix.sh lanq-makeready-tune.sh tests/run.sh tests/fix.sh tests/real-fix.sh tests/tune.sh
      - name: setfacl for the real ACL test
        if: runner.os == 'Linux'
        run: command -v setfacl >/dev/null || { sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q acl; }
      - name: Tests
        run: sh tests/run.sh
      - name: Fix-script tests, fakes only
        run: sh tests/fix.sh
      - name: Tune-scan tests (fake root)
        run: sh tests/tune.sh
  alpine:
    runs-on: ubuntu-latest
    container: alpine:3.21
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setfacl for the real ACL test
        run: apk add --no-cache acl
      - name: Tests (busybox sh)
        run: sh tests/run.sh
      - name: Fix-script tests, fakes only (busybox sh)
        run: sh tests/fix.sh
      - name: Tune-scan tests (busybox sh)
        run: sh tests/tune.sh
  # Real apply and undo on disposable GitHub-hosted runners only. The drivers refuse to run without LANQ_REAL_FIX_OK
  # and RUNNER_ENVIRONMENT=github-hosted (an accident guard, not a security boundary).
  real-fix-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LANQ_REAL_FIX_OK: disposable-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Pass 1: make the fixes necessary (this runner is thrown away)"
        shell: pwsh
        run: |
          $req = 'power.sleep,longpaths.on,git.longpaths,ssh.aclkeys'
          powercfg /change standby-timeout-ac 30
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0 -Type DWord
          git config --global --unset-all core.longpaths; git config --system core.longpaths false
          $d = Join-Path $env:ProgramData 'ssh'; if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d | Out-Null }
          icacls.exe $d /grant '*S-1-5-32-545:(OI)(CI)(RX)'   # the keys file inherits Users: read, so sshd would ignore it
          $k = Join-Path $d 'administrators_authorized_keys'
          if (-not (Test-Path $k)) { Set-Content -LiteralPath $k -Value 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample ci@build-01' }
          icacls.exe $k /reset; icacls.exe $k /setowner '*S-1-5-32-544'; icacls.exe $k
          if (Get-Service sshd -ErrorAction SilentlyContinue) { Stop-Service sshd -ErrorAction SilentlyContinue; Set-Service sshd -StartupType Manual; $req += ',ssh.start' }
          else { 'sshd is not installed on this runner image: ssh.start and ssh.auto are covered by the fake tests only' }
          "LANQ_REAL_FIX_REQUIRE=$req" >> $env:GITHUB_ENV
      - name: "Pass 1: real apply + undo (Windows PowerShell 5.1)"
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/real-fix.ps1
      - name: "Remove the record folder, so PowerShell 7 creates it (FileSystemAclExtensions.Create)"
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:ProgramData 'lanq-makeready') -Recurse -Force
      - name: "Pass 1: real apply + undo (PowerShell 7)"
        shell: pwsh
        env:
          LANQ_REAL_FIX_NEW_DIR: '1'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/real-fix.ps1
      - name: "Pass 2: LongPathsEnabled absent, git --system unset, sshd running but Manual"
        shell: pwsh
        run: |
          $req = 'longpaths.on,git.longpaths'
          Remove-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -ErrorAction SilentlyContinue
          git config --system --unset-all core.longpaths; git config --global --unset-all core.longpaths
          if (Get-Service sshd -ErrorAction SilentlyContinue) { Set-Service sshd -StartupType Manual; Start-Service sshd; $req += ',ssh.auto' }
          "LANQ_REAL_FIX_REQUIRE=$req" >> $env:GITHUB_ENV
          exit 0
      - name: "Pass 2: real apply + undo (Windows PowerShell 5.1)"
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/real-fix.ps1
      - name: "Pass 3 (tune): CPU max 90%, Delivery Optimization LAN peers, SysMain automatic, Defender scan at 02:00"
        shell: pwsh
        run: |
          $req = @()
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 90; powercfg /setactive SCHEME_CURRENT
          if ("$(powercfg /q SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX)" -match '0x0000005a') { $req += 'power.cpu' } else { 'processor power settings are not readable on this runner: power.cpu is covered by the fake tests only' }
          Remove-ItemProperty -Path HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization -Name DODownloadMode -ErrorAction SilentlyContinue
          $ds = 'Registry::HKEY_USERS\S-1-5-20\Software\Microsoft\Windows\CurrentVersion\DeliveryOptimization\Settings'
          New-Item -Path $ds -Force | Out-Null; Set-ItemProperty -Path $ds -Name DownloadMode -Value 1 -Type DWord; $req += 'do.mode'
          if (Get-Service SysMain -ErrorAction SilentlyContinue) { sc.exe config SysMain start= auto; $req += 'sysmain' } else { 'no SysMain service on this runner image: sysmain is covered by the fake tests only' }
          try { Set-MpPreference -ScanScheduleDay 0 -ScanScheduleTime 02:00:00 -ErrorAction Stop; $m = "$((Get-MpComputerStatus -ErrorAction Stop).AMRunningMode)"
            if (-not $m -or $m -eq 'Normal') { $req += 'defender.scantime' } else { "Defender runs in $m here: defender.scantime is covered by the fake tests only" } } catch { "Defender is not usable here ($($_.Exception.Message)): defender.scantime is covered by the fake tests only" }
          "LANQ_REAL_FIX_REQUIRE=$($req -join ',')" >> $env:GITHUB_ENV
          "LANQ_REAL_FIX_SET=tune" >> $env:GITHUB_ENV
          "LANQ_REAL_FIX_HOURS=00:00-07:00" >> $env:GITHUB_ENV
          exit 0
      - name: "Pass 3 (tune): real apply + undo (Windows PowerShell 5.1)"
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/real-fix.ps1
      - name: "Pass 3 (tune): real apply + undo (PowerShell 7)"
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/real-fix.ps1
  real-fix-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANQ_REAL_FIX_OK: disposable-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make the fixes necessary (this runner is thrown away)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
          sudo systemctl disable --now ssh.socket || true
          sudo systemctl disable --now ssh.service
          for t in sleep suspend hibernate hybrid-sleep; do sudo systemctl unmask "$t.target"; echo "$t.target: $(systemctl is-enabled "$t.target")"; done
          # what the scanner reports as "may sleep": logind idle suspend (logind is not restarted; the script reads the files)
          sudo mkdir -p /etc/systemd/logind.conf.d
          printf '[Login]\nIdleAction=suspend\n' | sudo tee /etc/systemd/logind.conf.d/90-lanq-ci.conf
      - name: Real apply + undo (systemd, root)
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" LANQ_REAL_FIX_OK="$LANQ_REAL_FIX_OK" sh tests/real-fix.sh
      - name: "Tune: make the tune fixes necessary (this runner is thrown away)"
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q cups cups-browsed
          sudo systemctl enable --now cups.service cups.socket cups.path cups-browsed.service
          sudo rm -f /etc/sysctl.d/99-zz-lanq-makeready.conf
          sudo sysctl -w fs.inotify.max_user_instances=128
          req=sysctl.tune,services.unused:cups-browsed,services.unused:cups
          # fstrim.timer only where the tune scan itself offers it on this runner (its disk may not report TRIM);
          # otherwise it is covered by the fake tests only, as the Windows legs do with optional items
          sudo systemctl disable --now fstrim.timer || true
          if sudo sh lanq-makeready-tune.sh --json - | grep -q '"fixId": "fstrim.timer"'; then req="$req,fstrim.timer"
          else echo "the tune scan does not offer fstrim.timer on this runner (no TRIM reported): covered by the fake tests only"; fi
          echo "LANQ_REAL_FIX_REQUIRE=$req" >> "$GITHUB_ENV"
      - name: "Tune: real apply + undo (systemd, root)"
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" LANQ_REAL_FIX_OK="$LANQ_REAL_FIX_OK" LANQ_REAL_FIX_REQUIRE="$LANQ_REAL_FIX_REQUIRE" sh tests/real-fix.sh --tune
