name: release
# Tag-only: pushing vX.Y.Z publishes the two scripts, the schema and SHA256SUMS as a GitHub Release,
# with a signed build-provenance attestation (verify with `gh attestation verify`).
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tests
        run: sh tests/run.sh
      - name: Collect files and checksums
        run: |
          mkdir dist
          cp lanq-makeready.ps1 lanq-makeready.sh schema/report.v1.json dist/
          cd dist && sha256sum lanq-makeready.ps1 lanq-makeready.sh report.v1.json > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/lanq-makeready.ps1, dist/lanq-makeready.sh, dist/report.v1.json'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
