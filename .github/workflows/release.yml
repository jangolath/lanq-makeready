name: release
# Tag-only: pushing vX.Y.Z publishes the scanner, tune and fix scripts, the three schemas and SHA256SUMS as a GitHub Release,
# with a signed build-provenance attestation (verify with `gh attestation verify`).
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scanner, fix and tune tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1; if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/fix.ps1; if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/tune.ps1; if ($LASTEXITCODE) { exit 1 }
      - name: Tune tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/tune.ps1
  release:
    needs: windows-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tests
        run: sh tests/run.sh && sh tests/fix.sh
      - name: Collect files and checksums
        run: |
          mkdir dist
          cp lanq-makeready.ps1 lanq-makeready.sh lanq-makeready-tune.ps1 lanq-makeready-tune.sh lanq-makeready-fix.ps1 lanq-makeready-fix.sh schema/report.v1.json schema/tune.v1.json schema/fix-record.v1.json dist/
          cd dist && sha256sum lanq-makeready.ps1 lanq-makeready.sh lanq-makeready-tune.ps1 lanq-makeready-tune.sh lanq-makeready-fix.ps1 lanq-makeready-fix.sh report.v1.json tune.v1.json fix-record.v1.json > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/lanq-makeready.ps1, dist/lanq-makeready.sh, dist/lanq-makeready-tune.ps1, dist/lanq-makeready-tune.sh, dist/lanq-makeready-fix.ps1, dist/lanq-makeready-fix.sh, dist/report.v1.json, dist/tune.v1.json, dist/fix-record.v1.json'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
